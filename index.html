<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fancy</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="intro">
  <div class="intro-inner">
    <div class="intro-title">FANCY</div>

    <div class="intro-bar">
      <div class="intro-progress" id="introProgress"></div>
    </div>

  </div>
</div>


<div id="app" style="display:none;">
 
<div class="atmosphere">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
</div>

<div class="top-bar">
  <div class="brand">
    <span class="brand-main">FANCY</span>
    <span class="brand-sub">archive</span>
  </div>
</div>

<section id="atelier" class="hero split">
  <div class="hero-left">
    <h1>Dressed<br>by Design</h1>
    <p>
      A personal system where your wardrobe becomes
      intentional, not accidental.
    </p>

    <div class="hero-actions">
      <button onclick="scrollToSection('wardrobe')">Enter Wardrobe</button>
      <button onclick="scrollToSection('generator')">Dress Me</button>
    </div>
  </div>

  <div class="hero-right">
    <div class="hero-block"></div>
  </div>
<!--<div class="hero-right">
  <div class="hero-stack">
    <div class="hero-card large">Scarlet Discipline</div>
    <div class="hero-card">Quiet Power</div>
    <div class="hero-card">Soft Control</div>
  </div>
  </div> -->

</section>

<section id="wardrobe">
  <h2>Wardrobe</h2>
  <div id="wardrobeGrid"></div>
  <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
  <button onclick="setCategory('all')">All</button>
  <button onclick="setCategory('old-money')">Old Money</button>
  <button onclick="setCategory('casual')">Casual</button>
  <button onclick="setCategory('evening')">Evening</button>
</div>

<button onclick="addItem()">Add Piece</button>
<div style="margin-top:20px; padding:20px; border:1px dashed #aaa;"
     ondragover="allowDrop(event)"
     ondrop="dropToWishlist()">
  Drop here → Wishlist
</div>
</section>

<section id="generator">
  <h2>Dress Me</h2>

  <button onclick="generateOutfit()">Generate Outfit</button>

  <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
  <button onclick="setMood('old-money')">Old Money</button>
  <button onclick="setMood('casual')">Casual</button>
  <button onclick="setMood('evening')">Evening</button>
  <button onclick="setMood('neutral')">Neutral</button>
</div>

  <div id="outfitResult"></div>
  <div id="history"></div>
</section>

<section id="week">
 <div class="week-flow">
  <button onclick="planWeek()">Plan My Week</button>
  <div id="weekResult"></div>
</div>
<div id="week"></div>
</section>

<section id="essentials">
  <h2>Essentials</h2>
  <p>Accessories, shoes, scents.</p>
</section>
</div>

<script src="js/app.js"></script>
<script src="js/loader.js"></script>
</body>
</html>
